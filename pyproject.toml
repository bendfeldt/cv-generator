[project]
name = "cvgen"
version = "0.1.0"
description = "Metadata-driven CV generator: YAML in, PDF and open-standard formats out, personal data asked at runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[project.scripts]
cvgen = "cvgen.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
